
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B FILMS Admin Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #090909;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .box {
      max-width: 500px;
      margin: 30px auto;
      padding: 22px;
      background: #171717;
      border: 1px solid #333;
      border-radius: 14px;
    }
    h1 { color: #ff5a1f; }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 7px;
    }
    input {
      background: #222;
      color: #fff;
      border: 1px solid #444;
    }
    button {
      background: #ff5a1f;
      color: #fff;
      border: none;
      font-weight: bold;
    }
    #status { overflow-wrap: anywhere; }
    small { color: #bbb; }
  </style>
</head>
<body>
  <div class="box">
    <h1>B FILMS</h1>
    <p>Admin Media Upload</p>

    <input id="email" type="email" placeholder="Admin email">
    <input id="password" type="password" placeholder="Admin password">
    <button onclick="login()">Login</button>

    <hr>

    <input id="file" type="file"
      accept="image/jpeg,image/png,image/webp,video/mp4,video/webm">

    <button onclick="uploadFile()">Upload Media</button>

    <p id="status">Login to begin.</p>
    <small>Maximum size: 20 MB. JPG, PNG, WEBP, MP4, WEBM.</small>
  </div>

<script>
  const SUPABASE_URL =
    "https://xqbkfolbkdaxaduerocq.supabase.co";

  const SUPABASE_KEY =
    "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

  const client = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  function showStatus(message) {
    document.getElementById("status").textContent = message;
  }

  async function login() {
    const email =
      document.getElementById("email").value.trim();
    const password =
      document.getElementById("password").value;

    const { error } = await client.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      showStatus("Login error: " + error.message);
      return;
    }

    showStatus("Login successful. Select a file.");
  }

  async function uploadFile() {
    const { data } = await client.auth.getSession();

    if (!data.session) {
      showStatus("Pehle login karo.");
      return;
    }

    const file = document.getElementById("file").files[0];

    if (!file) {
      showStatus("Pehle file select karo.");
      return;
    }

    const allowed = [
      "image/jpeg", "image/png", "image/webp",
      "video/mp4", "video/webm"
    ];

    if (!allowed.includes(file.type)) {
      showStatus("Ye file format supported nahi hai.");
      return;
    }

    if (file.size > 20 * 1024 * 1024) {
      showStatus("File 20 MB se chhoti honi chahiye.");
      return;
    }

    const safeName = file.name.replace(
      /[^a-zA-Z0-9._-]/g, "_"
    );

    const path = "uploads/" + Date.now() + "_" + safeName;

    showStatus("Uploading...");

    const { error } = await client.storage
      .from("b-films-media")
      .upload(path, file);

    if (error) {
      showStatus("Upload error: " + error.message);
      return;
    }

    showStatus("Upload successful: " + path);
  }
</script>
</body>
      </html>
